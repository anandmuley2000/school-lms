server:
  port: ${PORT:10000}
spring:
  profiles:
    default: development
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: UTC
app:
  jwt:
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  demo:
    reset-enabled: ${DEMO_RESET_ENABLED:false}
  upload-path: ${FILE_UPLOAD_PATH:./uploads}
management:
  endpoints:
    web:
      exposure:
        include: health
springdoc:
  swagger-ui:
    path: /swagger-ui.html
