server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:school_lms}?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

  sql:
    init:
      mode: never

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long-for-hs256!}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

  demo:
    reset-enabled: ${DEMO_RESET_ENABLED:false}
    data-enabled: ${DEMO_DATA_ENABLED:false}
